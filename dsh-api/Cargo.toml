# dsh-api
[package]
name = "dsh_api"
readme = "README.md"
version = "0.10.0"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.clippy]
uninlined_format_args = "allow"

[package.metadata.docs.rs]
all-features = true

[features]
generic = ["dep:erased-serde"]
manage = []
robot = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"], default-features = false }
erased-serde = { version = "0.4", optional = true, features = ["std"], default-features = false }
futures = { version = "0.3", features = ["alloc", "async-await"], default-features = false }
itertools = { version = "0.14", features = ["default"], default-features = false }
log = { version = "0.4", default-features = false }
percent-encoding = { version = "2", default-features = false }
regex = { version = "1", default-features = false }
regress = { version = "0.10", features = ["std"], default-features = false }
reqwest = { version = "0.13", features = ["default-tls", "form", "json"], default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false }
simple-mermaid = "0.2"

[dev-dependencies]
env_logger = "0.11"
regex = { version = "1", features = ["unicode-perl"] }
serde_yaml = "0.9.33"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
toml = { version = "0.9", features = ["display"] }

[build-dependencies]
dsh_api_build_helpers = { path = "../dsh-api-build", version = "0.7.0" }
openapiv3 = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
